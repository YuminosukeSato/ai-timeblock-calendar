name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test
        run: cargo test --workspace --exclude app-tauri

      - name: Cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --exclude app-tauri --all-targets -- -D warnings

      - name: Cargo fmt check (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: cargo fmt --all --check

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ts

      - name: Format check (advisory)
        continue-on-error: true
        run: pnpm format:check:ts

      - name: Test
        run: pnpm test
